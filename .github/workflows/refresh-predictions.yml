name: Refresh predictions

permissions:
  contents: write

on:
  schedule:
    # Every 3 hours, year-round. should_run_full_refresh.py gates the
    # actual work so this only does anything (FastF1 pulls, commits)
    # within a few days of an actual race weekend — no need to hand-edit
    # cron dates before every race to get tight same-day updates around
    # FP2/quali/the race itself.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      predict:
        description: >-
          Regenerate the next upcoming race's prediction even outside the
          race-weekend gate. For backfilling a schema change (e.g. a new
          predicted-row field) onto a not-yet-race-week prediction without
          waiting for the gate to open; not for regular use.
        required: false
        type: boolean
        default: false
      regrade:
        description: >-
          Also re-grade already-completed races (re-fetch their real result,
          re-score against the stored prediction — never regenerates the
          prediction itself). For backfilling accuracy/result_notes schema
          changes onto races graded before they existed; not for regular use.
        required: false
        type: boolean
        default: false
      fit_weights:
        description: >-
          Re-fit the base_score term weights against every graded round
          (model/fit_weights.py --apply) — writes fitted_weights.json and
          regenerates+re-grades every trained-on round's backtest with it,
          for a real before/after Brier comparison. A one-off, not for
          regular use; the fitted weights apply automatically to every
          later run once written.
        required: false
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r model/requirements.txt

      - name: Check if we're near a race weekend
        id: check
        working-directory: model
        run: python should_run_full_refresh.py

      - name: Predict the next upcoming race
        if: steps.check.outputs.should_run == 'true' || github.event.inputs.predict == 'true'
        working-directory: model
        run: python generate_predictions.py

      - name: Grade any races that have since finished
        if: steps.check.outputs.should_run == 'true'
        working-directory: model
        run: python check_results.py

      - name: Re-grade already-completed races (manual backfill)
        if: github.event.inputs.regrade == 'true'
        working-directory: model
        run: python check_results.py --regrade

      - name: Fit base_score term weights against the graded track record
        if: github.event.inputs.fit_weights == 'true'
        working-directory: model
        run: python fit_weights.py --apply

      - name: Commit updated predictions
        if: steps.check.outputs.should_run == 'true' || github.event.inputs.regrade == 'true' || github.event.inputs.predict == 'true' || github.event.inputs.fit_weights == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add frontend/public/predictions/
          if [ -f model/fitted_weights.json ]; then git add model/fitted_weights.json; fi
          git diff --staged --quiet || git commit -m "Refresh predictions"
          git push
