name: Refresh predictions

on:
  schedule:
    # Runs daily at 06:00 UTC — cheap enough to run year-round; picks up
    # live quali/FP2 automatically once a race weekend starts, and grades
    # the previous race as soon as its result is available.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r model/requirements.txt

      - name: Predict the next upcoming race
        working-directory: model
        run: python generate_predictions.py

      - name: Grade any races that have since finished
        working-directory: model
        run: python check_results.py

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add frontend/public/predictions/
          git diff --staged --quiet || git commit -m "Refresh predictions"
          git push
